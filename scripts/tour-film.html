<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TraceCite tour</title>
<meta name="description" content="A short film of what TraceCite does, drawn from the open document.">
<meta name="tour-fonts">
<style>
/* The film fills the window. Paper, one ink, one accent, lots of air.
   Only the play button, the seek bar and a "more" toggle stay on screen; everything else waits behind "more". */
:root{
  color-scheme:light;
  --paper:#fbfaf7; --ink:#17181c; --ink2:#5d5f66; --ink3:#9a9ca3; --line:#e7e4dc; --card:#ffffff;
  --accent:#ff5b2e; --accent-soft:rgba(255,91,46,.14);
  --blue:#3b6fd4; --green:#2f9a6f; --violet:#7b61c9;
  --disp:'Inter Tight',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  --text:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
  --band:44px;   /* the seek bar's own strip: the film never draws into it */
  --caph:64px;   /* one caption line under the stage; 0 when captions are off */
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;flex-direction:column;color:var(--ink);font-family:var(--text);font-size:15px;-webkit-font-smoothing:antialiased;font-synthesis:none;
  background:
    var(--paper)}
body.nocc{--caph:0px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* stage */
.film{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px 0}
.screen{position:relative;width:min(100%,calc((100vh - var(--band) - var(--caph) - 24px) * 16 / 9));aspect-ratio:16/9}
@supports (height:100dvh){.screen{width:min(100%,calc((100dvh - var(--band) - var(--caph) - 24px) * 16 / 9))}}
#stage{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;overflow:visible}
.cap{height:var(--caph);max-width:62ch;margin:0;padding:12px 0 0;text-align:center;color:var(--ink2);font-size:clamp(16px,1.45vw,20px);line-height:1.5;letter-spacing:-.005em;text-wrap:balance;transition:opacity .3s}
.cap.fade{opacity:0}
body.nocc .cap{display:none}
.bigplay{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:.7rem;min-height:46px;padding:.8rem 1.3rem;border-radius:999px;background:var(--ink);color:var(--paper);font:500 15px var(--text);letter-spacing:-.01em;white-space:nowrap;box-shadow:0 14px 34px -14px color-mix(in srgb,var(--ink) 45%,transparent);transition:transform .25s var(--ease)}
.bigplay:hover{transform:translateX(-50%) translateY(-2px)}
.bigplay svg{width:12px;height:12px;fill:var(--paper)}

/* hover tip and pinned card */
.tip,.pin{position:absolute;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -24px color-mix(in srgb,var(--ink) 30%,transparent);font-size:14px;line-height:1.55;color:var(--ink2)}
.tip{max-width:300px;padding:.65rem .85rem;pointer-events:none;z-index:5}
.tip b,.pin h3{display:block;margin:0 0 .2rem;color:var(--ink);font-family:var(--disp);font-weight:600;letter-spacing:-.02em}
.tip b{font-size:15px}
.pin{top:12px;right:12px;width:min(340px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;padding:.95rem 1.05rem 1.05rem;z-index:6}
.pin h3{font-size:18px;padding-right:2rem}
.pin p{margin:.7rem 0 0;padding-left:.85rem;border-left:2px solid var(--accent)}
.pin button{position:absolute;top:.5rem;right:.5rem;width:30px;height:30px;border-radius:50%;color:var(--ink3);font-size:18px}
.pin button:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink)}

/* the band: play, seek bar, time, more */
.band{flex:0 0 var(--band);display:flex;align-items:center;gap:10px;padding:0 10px;transition:opacity .5s;position:relative;z-index:10}
body.playing.idle .band{opacity:.3}
.band:hover,.band:focus-within{opacity:1!important}
.band>button{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--ink2);transition:background-color .15s ease,color .15s ease}
#more svg{width:20px;height:20px}
#play svg{width:17px;height:17px}
.band>button:hover,.band>button[aria-expanded=true]{color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}
.band svg{width:16px;height:16px;fill:currentColor}
#play{color:var(--ink)}
.bar{flex:1;position:relative;display:flex;align-items:center;gap:3px;height:28px;cursor:pointer;touch-action:none}
.bar i{position:relative;height:2px;border-radius:2px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;transition:height .2s}
.bar i.ch{margin-left:5px}
.bar:hover i,.bar:focus-visible i{height:4px}
.bar i b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink)}
.bartip{position:absolute;bottom:30px;transform:translateX(-50%);padding:.3rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink2);font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 10px 24px -14px color-mix(in srgb,var(--ink) 30%,transparent)}
.bartip i{font-style:normal;font-family:var(--mono);color:var(--ink3);margin-right:.4rem}
.time{color:var(--ink3);font:12px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* the "more" menu: speed, captions, voice, chapters, script, fullscreen */
.menu,.sheet{position:fixed;right:12px;bottom:calc(var(--band) + 6px);z-index:12;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 70px -30px color-mix(in srgb,var(--ink) 35%,transparent)}
.menu{width:min(304px,calc(100% - 24px));padding:6px}
.menu .row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:0 10px;border-radius:10px;color:var(--ink2);font-size:14px;text-align:left}
.menu button.row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink)}
.menu kbd{font:11px var(--mono);color:var(--ink3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.speeds{display:flex;gap:2px}
.speeds button{height:26px;padding:0 6px;border-radius:13px;font:12px var(--mono);color:var(--ink3)}
.speeds button:hover{color:var(--ink)}
.speeds button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.sw{position:relative;width:30px;height:18px;border-radius:9px;background:color-mix(in srgb,var(--ink) 14%,transparent);transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
[aria-pressed=true] .sw{background:var(--accent)}
[aria-pressed=true] .sw::after{transform:translateX(12px)}
.menu .keys{padding:8px 10px 6px;color:var(--ink3);font-size:12px;line-height:1.7}

/* side sheet: chapters or the narration script */
.sheet{width:min(400px,calc(100% - 24px));max-height:min(72vh,640px);overflow:auto;font-size:15px;line-height:1.5}
.sheet header{position:sticky;top:0;z-index:1;display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.sheet header b{flex:1;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sheet header button{font-size:22px;line-height:1;color:var(--ink3)}
.sheet .body{padding:8px 8px 14px}
.sheet h4{display:flex;justify-content:space-between;margin:12px 8px 4px;font:600 15px var(--disp);letter-spacing:-.015em;color:var(--ink)}
.sheet h4 span{font:400 12px var(--mono);color:var(--ink3);padding-top:2px}
.sheet .it{display:flex;gap:.7rem;width:100%;padding:.4rem .5rem;border-radius:8px;color:var(--ink2);text-align:left}
.sheet .it:hover{background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink)}
.sheet .it.now{color:var(--ink);background:var(--accent-soft)}
.sheet .it i{min-width:2.6rem;padding-top:.12rem;font:normal 12px var(--mono);color:var(--ink3)}
.sheet .notes{margin:14px 8px 0;padding-top:12px;border-top:1px solid var(--line);color:var(--ink3);font-size:13px;line-height:1.65}

/* svg type and interactive bits */
.t-d{font-family:var(--disp);letter-spacing:-.04em}
.t-b{font-family:var(--text);letter-spacing:-.01em}
.t-m{font-family:var(--mono)}
.mid{dominant-baseline:central}
.hot{cursor:pointer}
.hot:hover{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 45%,transparent))}
.btn{cursor:pointer}
.btn rect{fill:var(--card);stroke:var(--line);stroke-width:1.4px}
.btn text{fill:var(--ink2);font-family:var(--text);letter-spacing:-.01em}
.btn:hover rect{stroke:var(--accent)}
.btn:hover text{fill:var(--ink)}
.btn.on rect{fill:var(--accent-soft);stroke:var(--accent)}
.btn.on text{fill:var(--accent);font-weight:600}
.leaving{transition:opacity .5s ease}

/* playful cursor on the stage: an ink dot and a lazy ring that swells over things you can touch */
.cursor{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s}
.cursor.on{opacity:1}
.cursor i,.cursor b{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.cursor i{width:7px;height:7px;background:var(--ink)}
.cursor b{width:32px;height:32px;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);transition:width .25s var(--ease),height .25s var(--ease),border-color .25s,background .25s}
.cursor.hot b{width:54px;height:54px;border-color:var(--accent);background:var(--accent-soft)}
@media (hover:hover) and (pointer:fine){#stage,#stage *{cursor:none}}
@media (hover:none),(pointer:coarse){.cursor{display:none}}

@media (max-width:560px){.time{display:none}.band{gap:6px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}.cursor{display:none}#stage,#stage *{cursor:auto!important}}

/* TraceCite: the film wears the reader's theme (tour.js fills these in), and handwritten notes use a marker face. */
:root{--hand:'Kalam','Bradley Hand','Segoe Print','Comic Neue',cursive;--amber:#c48a20}
:root{/*TOUR-VARS*/}
.hand{font-family:var(--hand);letter-spacing:0}
body{color-scheme:var(--scheme,light)}
</style>
</head>
<body class="nostart">
<main class="film" id="film">
  <div class="screen" id="wrap">
    <svg id="stage" viewBox="0 0 1600 900" role="img" aria-label="Animated explainer stage"></svg>
    <div class="tip" id="tip" hidden></div>
    <div class="pin" id="pin" hidden><h3 id="pinT"></h3><p id="pinB"></p><button type="button" id="pinX" aria-label="Close">×</button></div>
    <button class="bigplay" id="bigplay" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 2.3c0-.9 1-1.5 1.8-1l8 5.2c.7.5.7 1.5 0 2l-8 5.2c-.8.5-1.8-.1-1.8-1z"/></svg><span id="bigplayT">Play</span></button>
  </div>
  <p class="cap" id="cap" aria-live="polite"></p>
</main>

<nav class="band" aria-label="Playback">
  <button type="button" id="play" aria-label="Play (Space)"><svg viewBox="0 0 16 16" id="playicon" aria-hidden="true"><path d="M4.2 2.3c0-.9 1-1.5 1.8-1l8 5.2c.7.5.7 1.5 0 2l-8 5.2c-.8.5-1.8-.1-1.8-1z"/></svg></button>
  <div class="bar" id="bar" tabindex="0" role="slider" aria-label="Seek" aria-valuemin="0"><div class="bartip" id="bartip" hidden></div></div>
  <span class="time" id="time">0:00 / 0:00</span>
  <button type="button" id="more" aria-label="More options" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.9"/><circle cx="10" cy="10" r="1.9"/><circle cx="16" cy="10" r="1.9"/></svg></button>
</nav>

<div class="menu" id="menu" role="menu" hidden>
  <div class="row">Speed<span class="speeds" id="speeds"></span></div>
  <button type="button" class="row" id="cc" role="menuitemcheckbox">Captions<span class="sw"></span></button>
  <button type="button" class="row" id="voice" role="menuitemcheckbox">Read aloud<span class="sw"></span></button>
  <hr>
  <button type="button" class="row" id="chapBtn" role="menuitem">Chapters<kbd>C</kbd></button>
  <button type="button" class="row" id="scriptBtn" role="menuitem">Script<kbd>N</kbd></button>
  <button type="button" class="row" id="fs" role="menuitem">Full screen<kbd>F</kbd></button>
  <p class="keys">Scroll to move through the story · click empty space for the next beat<br>↓ ↑ next and previous beat · Space play · ← → 5 s · Shift ← → scene</p>
</div>

<aside class="sheet" id="sheet" hidden aria-labelledby="sheetT">
  <header><b id="sheetT"></b><button type="button" id="sheetX" aria-label="Close">×</button></header>
  <div class="body" id="sheetBody"></div>
</aside>

<div class="cursor" id="cursor" aria-hidden="true"><i></i><b></b></div>
<noscript><p style="padding:2rem;font:18px system-ui">This film needs JavaScript.</p></noscript>

<script>/*TOUR-DATA*/</script>
<script>
"use strict";
/* ================= film settings =================
   Title and notes show in the Chapters sheet. Captions start on; viewers can turn them off under "more". */
const FILM={
  captions:true,
  notes:'A tour of TraceCite drawn from the document you have open: its own sentences, tags, highlights, symbols and history. Where the document has no recorded quotes yet, the evidence comes from the TraceCite sample document and says so. '+'Sample film for the explainer template: replace everything between SCENES START and SCENES END. Thickness is 0.1 mm × 2ⁿ, computed live. Nobody can really fold paper 42 times; it is a thought experiment. The Moon distance is the average, 384,400 km.'
};

/* ================= toolkit ================= */
const NS='http://www.w3.org/2000/svg';
const STY=new Set(['fill','stroke','opacity','stroke-width','font-size','font-weight','letter-spacing','stroke-dasharray','stroke-dashoffset','stroke-linecap','text-anchor','pointer-events']);
const PX=new Set(['stroke-width','font-size','letter-spacing']);
function S(tag,a,p){const e=document.createElementNS(NS,tag);if(a)for(const k in a){const v=a[k];if(v==null)continue;if(k==='text')e.textContent=v;else if(k==='cls')e.setAttribute('class',v);else if(STY.has(k))e.style.setProperty(k,(typeof v==='number'&&PX.has(k))?v+'px':String(v));else e.setAttribute(k,v);}if(p)p.appendChild(e);return e;}
const C={ink:'var(--ink)',mut:'var(--ink2)',dim:'var(--ink3)',line:'var(--line)',card:'var(--card)',paper:'var(--paper)',acc:'var(--accent)',soft:'var(--accent-soft)',blue:'var(--blue)',green:'var(--green)',vio:'var(--violet)'};
C.amb=C.acc; // alias, so scenes ported from the Spectrum reference keep working
const CAT=[C.acc,C.blue,C.green,C.vio,C.mut];
function T(p,x,y,s,o={}){return S('text',{x,y,text:s,'font-size':o.size||22,'font-weight':o.w||400,fill:o.fill||C.ink,'text-anchor':o.anchor||'start',cls:'t-'+(o.f||'b')+(o.cls?' '+o.cls:''),'letter-spacing':o.ls},p);}
function R(p,x,y,w,h,o={}){return S('rect',{x,y,width:w,height:h,rx:o.rx==null?18:o.rx,fill:o.fill||C.card,stroke:o.stroke||C.line,'stroke-width':o.sw==null?1.4:o.sw},p);}
const Gp=p=>S('g',{},p);
function BIG(p,x,y,s,o={}){return T(p,x,y,s,{size:o.size||170,f:'d',w:600,anchor:'middle',fill:o.fill||C.ink,cls:'mid'});}
function LBL(p,x,y,s,o={}){return T(p,x,y,s,{size:o.size||24,anchor:o.anchor||'middle',fill:o.fill||C.mut,f:o.f,w:o.w});}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const lerp=(a,b,k)=>a+(b-a)*k;
function hot(el,title,body){el.classList.add('hot');el.__info={title,body};return el;}
function arrow(p,x1,y1,x2,y2,o={}){const g=Gp(p);const col=o.col||C.dim,w=o.w||1.6,hl=o.head||11,a=Math.atan2(y2-y1,x2-x1);S('line',{x1,y1,x2:x2-Math.cos(a)*hl*.7,y2:y2-Math.sin(a)*hl*.7,stroke:col,'stroke-width':w,'stroke-dasharray':o.dash},g);const pts=[[x2,y2],[x2-Math.cos(a-.42)*hl,y2-Math.sin(a-.42)*hl],[x2-Math.cos(a+.42)*hl,y2-Math.sin(a+.42)*hl]];S('polygon',{points:pts.map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' '),fill:col},g);return g;}
function btn(p,x,y,w,h,label,fn,o={}){const g=S('g',{cls:'btn',transform:`translate(${x},${y})`},p);S('rect',{width:w,height:h,rx:h/2},g);S('text',{x:w/2,y:h/2,text:label,'text-anchor':'middle','font-size':o.size||18,cls:'mid'},g);g.addEventListener('click',e=>{e.stopPropagation();explore(null);fn();});g.on=v=>g.classList.toggle('on',!!v);return g;}
function slider(p,x,y,w,min,max,val,label,fmt,onCh){const g=S('g',{transform:`translate(${x},${y})`},p);S('line',{x1:0,y1:0,x2:w,y2:0,stroke:C.line,'stroke-width':4,'stroke-linecap':'round'},g);const fl=S('line',{x1:0,y1:0,x2:0,y2:0,stroke:C.acc,'stroke-width':4,'stroke-linecap':'round'},g);const kn=S('circle',{cy:0,r:11,fill:C.ink},g);T(g,0,-22,label,{size:17,fill:C.mut});const vl=T(g,w,-22,'',{size:17,anchor:'end',f:'m'});const hit=S('rect',{x:-16,y:-22,width:w+32,height:44,fill:'transparent'},g);hit.style.cursor='ew-resize';hit.style.touchAction='none';hit.classList.add('hot');let v=val,drag=false;const set=(nv,emit)=>{v=clamp(nv,min,max);const px=(v-min)/(max-min)*w;kn.setAttribute('cx',px);fl.setAttribute('x2',px);vl.textContent=fmt(v);if(emit&&onCh)onCh(v);};const fromE=e=>{const m=g.getScreenCTM();if(!m)return;const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());set(min+(pt.x/w)*(max-min),true);};hit.addEventListener('pointerdown',e=>{e.stopPropagation();drag=true;try{hit.setPointerCapture(e.pointerId);}catch(_){}explore(null);fromE(e);});hit.addEventListener('pointermove',e=>{if(drag)fromE(e);});const up=()=>{drag=false;};hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);hit.addEventListener('click',e=>e.stopPropagation());set(val,false);g.set=nv=>{if(!drag)set(nv,false);};g.get=()=>v;return g;}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function disc(p,x,y,r){return S('circle',{cx:x,cy:y,r,fill:C.card,stroke:C.line,'stroke-width':1.4},p);}

/* ================= choreography engine =================
   Every element is a <g> registered with show(el, fromBeat, toBeat) and optionally
   pose(el, [[beat,x,y,scale],...]) and dim(el, [[beat,level],...]). Beats may be fractional.
   Nothing accumulates by accident: if an element has a toBeat, it leaves. */
const TITLE=2.8;
function makeA(s){const reg=[],ticks=[];
  const bt=b=>{if(b===Infinity)return 1e9;if(typeof b==='object')return b.s;const i=Math.floor(b),f=b-i;if(i>=s.bs.length)return s.dur;if(i<0)return 0;return s.bs[i]+f*s.bd[i];};
  const entry=el=>{let r=reg.find(q=>q.el===el);if(!r){r={el,from:-1,to:Infinity,o:{}};reg.push(r);}return r;};
  const A={st:{},bt,b:s.bs,d:s.bd,
    show(el,from,to=Infinity,o={}){const r=entry(el);r.from=from;r.to=to;r.o=o;return el;},
    pose(el,kf,d=1.1){const r=entry(el);r.kf=kf;r.kd=d;return el;},
    dim(el,kf){const r=entry(el);r.dk=kf;return el;},
    tick(fn){ticks.push(fn);},
    kf(t,k,d=1){let v=k[0][1];for(let i=1;i<k.length;i++){const p=eio((t-bt(k[i][0]))/d);if(p<=0)break;v=lerp(v,k[i][1],p);}return v;},
    bi(t){let k=-1;while(k+1<s.bs.length&&t>=s.bs[k+1])k++;return k;},
    run(t){for(const r of reg){const o=r.o;let k=1,ex=1;
        if(r.from!==-1){k=eo((t-bt(r.from)-(o.delay||0))/(o.d||.9));}
        if(r.to!==Infinity){ex=1-eo((t-bt(r.to)-(o.outDelay||0))/(o.out||.55));}
        let x=0,y=0,sc=1;if(r.kf){let cur=r.kf[0].slice(1);for(let i=1;i<r.kf.length;i++){const[b,...v]=r.kf[i];const p=eio((t-bt(b))/r.kd);if(p<=0)break;cur=cur.map((c,j)=>lerp(c,v[j]??c,p));}x=cur[0];y=cur[1];sc=cur[2]??1;}

/* hover tips and pinned explanations on anything that glows */
const hotOf=e=>{let n=e.target;while(n&&n!==stage){if(n.__info)return n;n=n.parentNode;}return null;};
stage.addEventListener('pointermove',e=>{const h=hotOf(e);if(!h){tip.hidden=true;return;}tip.innerHTML='';const b=document.createElement('b');b.textContent=h.__info.title;tip.append(b,h.__info.body||'');tip.hidden=false;const r=wrapEl.getBoundingClientRect();let x=e.clientX-r.left+18,y=e.clientY-r.top+18;const tw=tip.offsetWidth,th=tip.offsetHeight;if(x+tw>r.width-8)x=e.clientX-r.left-tw-18;if(y+th>r.height-8)y=e.clientY-r.top-th-18;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';});
stage.addEventListener('pointerleave',()=>{tip.hidden=true;});
stage.addEventListener('click',e=>{const h=hotOf(e);if(h)explore(h.__info);});
/* A click on empty space moves the story on by one beat, like turning a page; anything you can touch keeps its own click. */
function beatNow_(){const i=sceneAt(Tm),s=scenes[i],lt=Tm-s.t0;let b=-1;while(b+1<s.bs.length&&lt>=s.bs[b+1])b++;return{i,s,b};}
function nextBeat(){const{i,s,b}=beatNow_();if(b+1<s.bs.length)setT(s.t0+s.bs[b+1]+.01);else if(i<scenes.length-1)setT(scenes[i+1].t0+.01);}
function prevBeat(){const{i,s,b}=beatNow_();const start=b<0?s.t0:s.t0+s.bs[b];if(Tm-start>1.2)setT(start+.01);else if(b>0)setT(s.t0+s.bs[b-1]+.01);else if(b===0)setT(s.t0+.01);else if(i>0){const p=scenes[i-1];setT(p.t0+p.bs[p.bs.length-1]+.01);}}
$('film').addEventListener('click',e=>{if(e.defaultPrevented||hotOf(e)||e.target.closest?.('.btn,.hot,button,a,input,.pin,.tip'))return;if(!pin.hidden){pin.hidden=true;return;}nextBeat();});

/* cursor ring, and the band fading while the film plays untouched */
const cursorEl=$('cursor'),ring=cursorEl.querySelector('b'),dot=cursorEl.querySelector('i');let cx=0,cy=0,rx=0,ry=0;
stage.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;cx=e.clientX;cy=e.clientY;cursorEl.classList.add('on');cursorEl.classList.toggle('hot',!!(hotOf(e)||e.target.closest?.('.btn,.hot')));});
stage.addEventListener('pointerleave',()=>cursorEl.classList.remove('on'));
stage.addEventListener('pointerdown',()=>cursorEl.classList.add('down'));addEventListener('pointerup',()=>cursorEl.classList.remove('down'));
(function follow(){rx+=(cx-rx)*.22;ry+=(cy-ry)*.22;dot.style.left=cx+'px';dot.style.top=cy+'px';ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(follow);})();
let idleT=0;function idle(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if(playing&&menu.hidden)document.body.classList.add('idle');},2400);}
addEventListener('pointermove',idle);

document.addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;idle();
  if(e.key===' '||e.code==='Space'){if(tg==='BUTTON')return;e.preventDefault();setPlaying(!playing);}
  else if(e.key==='ArrowRight'){e.preventDefault();if(e.shiftKey)nextScene();else setT(Tm+5);}
  else if(e.key==='ArrowLeft'){e.preventDefault();if(e.shiftKey)prevScene();else setT(Tm-5);}
  else if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();nextBeat();}
  else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();prevBeat();}
  else if(e.key==='f'||e.key==='F')toggleFs();
  else if(e.key==='c'||e.key==='C')openSheet('chapters');
  else if(e.key==='n'||e.key==='N')openSheet('script');
  else if(e.key==='Escape'){if(menu.hidden&&sheet.hidden&&pin.hidden){try{parent.postMessage('tour-close','*');}catch(_){}}setMenu(false);closeSheet();pin.hidden=true;}});

function start(data){const saved=(data&&data.T)||0,h=parseInt(location.hash.slice(1),10);let t=saved||(window.TOUR?0:1.6);if(!saved&&h>1&&h<=scenes.length)t=scenes[h-1].t0+1.6;
  Tm=clamp(t,0,TOTAL-.001);if(saved)begin();requestAnimationFrame(frame);if(window.TOUR&&window.TOUR.autoplay)setTimeout(()=>setPlaying(true),250);}
start({});
</script>
</body>
</html>
