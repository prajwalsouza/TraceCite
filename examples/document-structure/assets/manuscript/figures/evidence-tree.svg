<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The hierarchy of this paper</title>
  <desc id="d">An indented tree: the document holds sections, a section holds paragraphs, a paragraph holds sentences, a sentence holds citations, and a citation leads to a source with an exact quote and its location. A second sentence has no citation and is marked as interpretation.</desc>
  <rect width="960" height="460" rx="24" fill="hsl(60, 50%, 98%)"/>
  <g stroke="hsl(74, 19%, 80%)" stroke-width="2.5" fill="none">
    <path d="M84 84 V 120 H 120"/>
    <path d="M144 140 V 176 H 180"/>
    <path d="M204 196 V 232 H 240 M204 232 V 422 H 240"/>
    <path d="M264 252 V 288 H 300"/>
    <path d="M324 308 V 330"/>
  </g>
  <g font-size="19">
    <rect x="60" y="48" width="230" height="36" rx="18" fill="hsl(80, 20%, 90%)"/>
    <text x="80" y="72" font-weight="600" fill="hsl(86, 20%, 18%)">Document</text>
    <rect x="120" y="104" width="230" height="36" rx="18" fill="hsl(150, 30%, 88%)"/>
    <text x="140" y="128" font-weight="600" fill="hsl(86, 20%, 18%)">Section</text>
    <rect x="180" y="160" width="230" height="36" rx="18" fill="hsl(150, 30%, 92%)"/>
    <text x="200" y="184" font-weight="600" fill="hsl(86, 20%, 18%)">Paragraph</text>
    <rect x="240" y="216" width="230" height="36" rx="18" fill="hsl(210, 40%, 92%)"/>
    <text x="260" y="240" font-weight="600" fill="hsl(86, 20%, 18%)">Sentence</text>
    <rect x="300" y="272" width="230" height="36" rx="18" fill="hsl(210, 40%, 95%)"/>
    <text x="320" y="296" font-weight="600" fill="hsl(86, 20%, 18%)">Citation</text>
    <rect x="300" y="330" width="560" height="56" rx="16" fill="hsl(36, 70%, 92%)"/>
    <text x="324" y="354" font-size="16" fill="hsl(36, 30%, 30%)">Source · exact quote · where it sits in the source</text>
    <text x="324" y="376" font-size="15" fill="hsl(87, 10%, 42%)">or, when no passage was checked: reference only, unverified</text>
  </g>
  <g font-size="19">
    <rect x="240" y="404" width="300" height="36" rx="18" fill="hsl(210, 40%, 92%)"/>
    <text x="260" y="428" font-weight="600" fill="hsl(86, 20%, 18%)">Sentence</text>
    <text x="360" y="428" font-size="16" fill="hsl(87, 10%, 40%)">interpretation</text>
  </g>
  <g font-size="16" fill="hsl(87, 10%, 40%)">
    <text x="560" y="128">tags: role, support, topic</text>
    <text x="560" y="240">a short review of its support</text>
  </g>
</svg>
