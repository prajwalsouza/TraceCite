<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Linear, hierarchical and networked structure</title>
  <desc id="d">Three panels. Left: a chain of units read in one order, like a roll. Middle: a tree in which every unit has one parent, like an outline. Right: a network in which units link across branches, like hypertext.</desc>
  <rect width="960" height="440" rx="24" fill="hsl(60, 50%, 98%)"/>
  <g font-size="22" font-weight="600" fill="hsl(86, 20%, 18%)" text-anchor="middle">
    <text x="160" y="56">Linear</text>
    <text x="480" y="56">Hierarchical</text>
    <text x="800" y="56">Networked</text>
  </g>
  <g font-size="16" fill="hsl(87, 10%, 40%)" text-anchor="middle">
    <text x="160" y="400">one reading order</text>
    <text x="480" y="400">one parent per unit</text>
    <text x="800" y="400">links cross branches</text>
  </g>
  <!-- linear -->
  <g stroke="hsl(36, 40%, 66%)" stroke-width="2.5" fill="none">
    <line x1="160" y1="110" x2="160" y2="340"/>
  </g>
  <g fill="hsl(36, 70%, 84%)" stroke="hsl(36, 40%, 66%)" stroke-width="2">
    <rect x="120" y="96" width="80" height="30" rx="10"/>
    <rect x="120" y="154" width="80" height="30" rx="10"/>
    <rect x="120" y="212" width="80" height="30" rx="10"/>
    <rect x="120" y="270" width="80" height="30" rx="10"/>
    <rect x="120" y="328" width="80" height="30" rx="10"/>
  </g>
  <line x1="320" y1="90" x2="320" y2="370" stroke="hsl(80, 15%, 86%)" stroke-width="2"/>
  <line x1="640" y1="90" x2="640" y2="370" stroke="hsl(80, 15%, 86%)" stroke-width="2"/>
  <!-- tree -->
  <g stroke="hsl(150, 20%, 60%)" stroke-width="2.5" fill="none">
    <path d="M480 126 L400 196 M480 126 L560 196 M400 226 L360 296 M400 226 L440 296 M560 226 L520 296 M560 226 L600 296"/>
  </g>
  <g fill="hsl(150, 30%, 84%)" stroke="hsl(150, 20%, 60%)" stroke-width="2">
    <rect x="440" y="96" width="80" height="30" rx="10"/>
    <rect x="360" y="196" width="80" height="30" rx="10"/>
    <rect x="520" y="196" width="80" height="30" rx="10"/>
    <rect x="330" y="296" width="60" height="30" rx="10"/>
    <rect x="410" y="296" width="60" height="30" rx="10"/>
    <rect x="490" y="296" width="60" height="30" rx="10"/>
    <rect x="570" y="296" width="60" height="30" rx="10"/>
  </g>
  <!-- network -->
  <g stroke="hsl(260, 20%, 66%)" stroke-width="2.5" fill="none">
    <path d="M740 130 L860 150 M740 130 L700 240 M860 150 L880 270 M700 240 L800 320 M880 270 L800 320 M740 130 L880 270 M860 150 L700 240 M800 210 L740 130 M800 210 L880 270 M800 210 L800 320"/>
  </g>
  <g fill="hsl(260, 30%, 88%)" stroke="hsl(260, 20%, 66%)" stroke-width="2">
    <circle cx="740" cy="130" r="18"/>
    <circle cx="860" cy="150" r="18"/>
    <circle cx="700" cy="240" r="18"/>
    <circle cx="880" cy="270" r="18"/>
    <circle cx="800" cy="320" r="18"/>
    <circle cx="800" cy="210" r="18"/>
  </g>
</svg>
